# Base Compose stack (Docker PHP guide pattern + PostgreSQL).
# Local:  docker compose -f compose.yaml -f compose.dev.yaml up --build
# Prod:   docker compose -f compose.yaml -f compose.prod.yaml up --build -d

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db-password
    environment:
      APP_ENV: production
      APP_DEBUG: "0"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: template_admin
      DB_USER: postgres
      DB_PASSWORD_FILE: /run/secrets/db-password
      SESSION_LIFETIME: "7200"
    # Allow www-data to bind port 80 (PHP Apache image + USER www-data).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    user: postgres
    secrets:
      - db-password
    volumes:
      # Postgres 18+: mount parent dir (not .../data) for versioned PGDATA layout.
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: template_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

secrets:
  db-password:
    file: db/password.txt
