# Local development overrides (bind mounts + Compose Watch).
# Docs: https://docs.docker.com/compose/how-tos/file-watch/
#       https://docs.docker.com/engine/storage/bind-mounts/
#
# Subir com live reload (recomendado — um comando só):
#   docker compose -f compose.yaml -f compose.dev.yaml up --build --watch
#
# Ou detached (bind mounts já refletem Twig/PHP/CSS/JS no save):
#   docker compose -f compose.yaml -f compose.dev.yaml up --build -d

services:
  server:
    build:
      target: development
    environment:
      APP_ENV: development
      APP_DEBUG: "1"
      APP_URL: http://localhost:8080
    # Bind mounts = hot reload para PHP/Twig/assets (Apache lê o host).
    # :z = SELinux (Fedora) — necessário para o container acessar os dirs.
    volumes:
      - ./src:/var/www/html/src:z
      - ./views:/var/www/html/views:z
      - ./public:/var/www/html/public:z
      - ./config:/var/www/html/config:z
      - ./database:/var/www/html/database:z
      - ./routes.php:/var/www/html/routes.php:z
      - ./phinx.php:/var/www/html/phinx.php:z
      - ./tests:/var/www/html/tests:z
    develop:
      watch:
        # Sync da doc Compose Watch (complementa binds; útil com `up --watch`).
        - path: ./src
          target: /var/www/html/src
          action: sync
          initial_sync: true
        - path: ./views
          target: /var/www/html/views
          action: sync
          initial_sync: true
        - path: ./public
          target: /var/www/html/public
          action: sync
          initial_sync: true
        - path: ./config
          target: /var/www/html/config
          action: sync
          initial_sync: true
        - path: ./database
          target: /var/www/html/database
          action: sync
          initial_sync: true
        - path: ./routes.php
          target: /var/www/html/routes.php
          action: sync
          initial_sync: true
        - path: ./phinx.php
          target: /var/www/html/phinx.php
          action: sync
          initial_sync: true
        - path: ./tests
          target: /var/www/html/tests
          action: sync
          initial_sync: true
        - path: ./composer.json
          action: rebuild
        - path: ./composer.lock
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

  db:
    ports:
      - "5432:5432"
